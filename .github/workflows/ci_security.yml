name: Security Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: none
  id-token: none
  security-events: none
  packages: none

jobs:
  call_reusable_vuln_scan:
    name: OSV-Scanner
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: complytime/org-infra/.github/workflows/reusable_vuln_scan.yml@8f347ba1aa2c7e9eb3b70e69c1709ddb456cd64a # v0.9.0
    with:
      # OSV focuses on known CVEs in dependencies; Trivy adds broader coverage
      enable_trivy_source: true
      trivy_ignorefile: ''

  call_reusable_security:
    name: OpenSSF Scorecards
    permissions:
      contents: read
      id-token: write
      security-events: write
    uses: complytime/org-infra/.github/workflows/reusable_security.yml@8f347ba1aa2c7e9eb3b70e69c1709ddb456cd64a # v0.9.0
