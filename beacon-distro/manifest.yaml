dist:
  name: otelcol-beacon
  module: github.com/complytime/complybeacon/beacon
  description: complybeacon collector distro
  output_path: ./beacon

# VERSION MANAGEMENT
# ------------------
# This manifest is the single source of truth for OTel Collector versions.
# Components use the experimental series (v0.x), providers use stable (v1.x).
#
# proofwatch is a separate Go module that only depends on pdata and manages
# its own OTel versions independently. Dependabot can bump proofwatch/pdata
# without requiring changes here.
#
# To upgrade the collector stack:
#   1. Update versions in this manifest (manual step, see DEVELOPMENT.md)
#   2. Run `task version:sync` to propagate to other collector modules
#   3. Verify with `task version:check` and `task integration:test`
#
# The builder (ocb) requires explicit versions in the manifest.
# Versionless entries generate invalid go.mod syntax.

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.156.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/awss3exporter v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/fileexporter v0.156.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.156.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/webhookeventreceiver v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filelogreceiver v0.156.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.65.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.65.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/httpprovider v1.65.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/httpsprovider v1.65.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.65.0

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/oidcauthextension v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/bearertokenauthextension v0.156.0

connectors:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/signaltometricsconnector v0.156.0
